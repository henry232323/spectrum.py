# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
asyncapi: 3.0.0
info:
  title: RSI Spectrum websocket (unofficial)
  version: 2026.11.0
  description: 'JSON text frames shaped `{"type": "<event>", ...payload}`. Connect with the JWT from `auth/identify`
    as `?token=`. Unsubscribing is an HTTP call (`subscription/remove`), not a frame. There are no heartbeats; spectrum.py
    reconnects after 360 s without a frame (backoff 1 -> 60 s) and re-identifies for a fresh token. The experimental
    gRPC transport is deliberately not described here.'
  license:
    name: MIT
servers:
  production:
    host: robertsspaceindustries.com
    pathname: /ws/spectrum
    protocol: wss
    security:
    - $ref: '#/components/securitySchemes/jwt'
