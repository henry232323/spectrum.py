# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/v2/member/profile:
  post:
    operationId: v2_member_profile
    tags:
    - v2-member
    x-spectrum:
      python: HTTP.v2_member_profile
      auth: unknown
      verified: false
      write: false
      since: v2
      constant: V2_MEMBER_PROFILE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              member_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                member_id: '1000001'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
