# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/v2/lobby/chats/list:
  post:
    operationId: v2_lobby_chats_list
    tags:
    - v2-lobby
    x-spectrum:
      python: HTTP.v2_lobby_chats_list
      auth: unknown
      verified: false
      write: false
      since: v2
      constant: V2_LOBBY_CHATS_LIST
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              page:
                type:
                - integer
                - 'null'
              pagesize:
                type:
                - integer
                - 'null'
          examples:
            sample1:
              value:
                page: 1
                pagesize: 20
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
