# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/reaction/add:
  post:
    operationId: add_reaction
    tags:
    - reaction
    x-spectrum:
      python: HTTP.add_reaction
      auth: session
      verified: false
      write: true
      constant: ADD_REACTION
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              reaction_type:
                type:
                - string
                - 'null'
              entity_type:
                type:
                - string
                - 'null'
              entity_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                reaction_type: ':-1:'
                entity_type: forum_thread
                entity_id: '391573'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
