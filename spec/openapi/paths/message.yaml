# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/message/create:
  post:
    operationId: send_message
    tags:
    - message
    x-spectrum:
      python: HTTP.send_message
      auth: session
      verified: false
      write: true
      constant: CREATE_MESSAGE_ENDPOINT
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data:
                    $ref: ../../schemas/message.json
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
/api/spectrum/message/delete:
  post:
    operationId: delete_message
    tags:
    - message
    x-spectrum:
      python: HTTP.delete_message
      auth: session
      verified: false
      write: true
      constant: DELETE_MESSAGE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              message_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                message_id: '123'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
