/api/spectrum/message/history:
  post:
    operationId: fetch_history
    tags:
    - message
    x-spectrum:
      python: HTTP.fetch_history
      auth: anonymous
      verified: true
      write: false
      constant: FETCH_HISTORY
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              lobby_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              timeframe:
                type:
                - string
                - 'null'
              message_id: {}
              size:
                type:
                - integer
                - 'null'
          examples:
            sample1:
              value:
                lobby_id: '1'
                timeframe: before
                message_id: null
                size: 50
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
