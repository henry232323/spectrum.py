# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/member/counters:
  post:
    operationId: fetch_member_counters
    tags:
    - member
    x-spectrum:
      python: HTTP.fetch_member_counters
      auth: unknown
      verified: false
      write: false
      constant: FETCH_MEMBER_COUNTERS
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              member_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              community_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                member_id: '1000001'
                community_id: '1'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
