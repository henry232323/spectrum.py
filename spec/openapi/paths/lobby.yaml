# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/lobby/acceptInvite:
  post:
    operationId: lobby_accept_invite
    tags:
    - lobby
    x-spectrum:
      python: HTTP.lobby_accept_invite
      auth: session
      verified: false
      write: true
      constant: LOBBY_ACCEPT_INVITE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              lobby_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                lobby_id: '123'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
