# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/v2/community/emoji/create:
  post:
    operationId: v2_community_emoji_create
    tags:
    - v2-community
    x-spectrum:
      python: HTTP.v2_community_emoji_create
      auth: session
      verified: false
      write: true
      since: v2
      constant: V2_COMMUNITY_EMOJI_CREATE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              community_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              name:
                type:
                - string
                - 'null'
              media_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                community_id: '1'
                name: emoji_name
                media_id: '123'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
