# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/v2/bookmark/add:
  post:
    operationId: v2_bookmark_add
    tags:
    - v2-social
    x-spectrum:
      python: HTTP.v2_bookmark_add
      auth: session
      verified: false
      write: true
      since: v2
      constant: V2_BOOKMARK_ADD
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              entity_type:
                type:
                - string
                - 'null'
              entity_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              folder_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                entity_type: lobby
                entity_id: '123'
                folder_id: '456'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
