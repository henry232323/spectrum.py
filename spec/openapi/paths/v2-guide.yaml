/api/spectrum/v2/guide/deregister:
  post:
    operationId: v2_guide_deregister
    tags:
    - v2-guide
    x-spectrum:
      python: HTTP.v2_guide_deregister
      auth: unknown
      verified: false
      write: false
      since: v2
      constant: V2_GUIDE_DEREGISTER
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          examples:
            sample1:
              value: {}
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
