# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/broadcast-message/create:
  post:
    operationId: broadcast_message_create
    tags:
    - notification
    x-spectrum:
      python: HTTP.broadcast_message_create
      auth: session
      verified: false
      write: true
      constant: BROADCAST_MESSAGE_CREATE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
