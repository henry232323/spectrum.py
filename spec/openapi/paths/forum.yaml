/api/spectrum/forum/thread/create:
  post:
    operationId: create_thread
    tags:
    - forum
    description: Retried up to 6 times while an image block is still processing ('Invalid image block data').
    x-spectrum:
      python: HTTP.create_thread
      auth: session
      verified: false
      write: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              type:
                type:
                - string
                - 'null'
              channel_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              label_id: {}
              subject:
                type:
                - string
                - 'null'
              content_blocks:
                type: array
              plaintext:
                type:
                - string
                - 'null'
              highlight_role_id: {}
              is_locked:
                type:
                - boolean
                - 'null'
              is_reply_nesting_disabled:
                type:
                - boolean
                - 'null'
          examples:
            sample1:
              value:
                type: discussion
                channel_id: '305988'
                label_id: null
                subject: Redacted text 1
                content_blocks:
                - id: 1
                  type: text
                  data:
                    blocks:
                    - key: dr2qu
                      text: Redacted text 2.
                      type: unstyled
                      depth: 0
                      inlineStyleRanges: []
                      entityRanges: []
                      data: {}
                    entityMap: {}
                plaintext: Redacted text 3.
                highlight_role_id: null
                is_locked: false
                is_reply_nesting_disabled: false
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data:
                    $ref: ../../schemas/thread.json
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
