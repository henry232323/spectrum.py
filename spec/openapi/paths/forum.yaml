# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/forum/channel/create:
  post:
    operationId: create_category
    tags:
    - forum
    x-spectrum:
      python: HTTP.create_category
      auth: session
      verified: false
      write: true
      constant: CREATE_CATEGORY
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              community_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              group_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              name:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              color:
                type:
                - string
                - 'null'
              sort_filter: {}
              label_required:
                type:
                - integer
                - 'null'
          examples:
            sample1:
              value:
                community_id: '100987'
                group_id: '102761'
                name: Cool category
                description: For things
                color: FF6262
                sort_filter: null
                label_required: 0
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
