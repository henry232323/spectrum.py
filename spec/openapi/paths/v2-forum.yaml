# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
/api/spectrum/v2/forum/channel/group/list:
  post:
    operationId: v2_forum_channel_group_list
    tags:
    - v2-forum
    x-spectrum:
      python: HTTP.v2_forum_channel_group_list
      auth: unknown
      verified: false
      write: false
      since: v2
      constant: V2_FORUM_CHANNEL_GROUP_LIST
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              community_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
          examples:
            sample1:
              value:
                community_id: '1'
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
