/api/spectrum/v2/moderation/kickban:
  post:
    operationId: v2_moderation_kickban
    tags:
    - v2-misc
    x-spectrum:
      python: HTTP.v2_moderation_kickban
      auth: unknown
      verified: false
      write: false
      since: v2
      constant: V2_MODERATION_KICKBAN
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              community_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              member_id:
                type:
                - string
                - integer
                - 'null'
                pattern: ^\d+$
              action:
                type:
                - string
                - 'null'
              reason:
                type:
                - string
                - 'null'
              duration: {}
          examples:
            sample1:
              value:
                community_id: '1'
                member_id: '1000001'
                action: kick
                reason: Rule violation
                duration: null
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
