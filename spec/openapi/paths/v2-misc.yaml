/api/spectrum/v2/game/party:
  post:
    operationId: v2_game_party
    tags:
    - v2-misc
    x-spectrum:
      python: HTTP.v2_game_party
      auth: unknown
      verified: false
      write: false
      since: v2
      constant: V2_GAME_PARTY
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          examples:
            sample1:
              value: {}
    responses:
      '200':
        description: Envelope. `success` is 1 on success; `data` holds the result.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../../schemas/envelope.json
              - properties:
                  data: {}
      default:
        description: Error envelope (`success` 0, `code` e.g. ErrAccessDenied), or a non-JSON error page.
        content:
          application/json:
            schema:
              $ref: ../../schemas/envelope.json
