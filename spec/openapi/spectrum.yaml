# Bootstrapped by scripts/bootstrap_spec.py, then maintained by hand.
openapi: 3.1.0
info:
  title: RSI Spectrum HTTP API (unofficial)
  version: 2026.11.0
  summary: Community description of the undocumented endpoints the Spectrum web client uses.
  description: 'Not made, endorsed or supported by Cloud Imperium Games or Roberts Space Industries. Every operation
    is a POST with a JSON body (multipart for uploads) returning the envelope in schemas/envelope.json. `x-spectrum.verified:
    false` means the shape comes only from code and docstring samples, not from a recorded response.'
  license:
    name: MIT
    identifier: MIT
